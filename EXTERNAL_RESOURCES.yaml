external_resources:
  - name: OpenAI API
    purpose: Dialogue, recipe, and judge text generation.
    env_vars:
      - OPENAI_API_KEY
      - OPENAI_MODEL_ALLOWLIST
    notes: Routed via backend/utils/model_router.py

  - name: Anthropic API
    purpose: Dialogue and judge text generation.
    env_vars:
      - ANTHROPIC_API_KEY
      - ANTHROPIC_MODEL_ALLOWLIST
    notes: Routed via backend/utils/model_router.py

  - name: Google Gemini Developer API
    purpose: Optional text generation provider (Gemini models).
    env_vars:
      - GOOGLE_API_KEY
      - GOOGLE_MODEL_ALLOWLIST
    notes: Routed via backend/utils/model_router.py using google-genai SDK.

  - name: OpenRouter
    purpose: Lab-only routing for Haiku dialogue, Opus judge, and Jev stop checks onto one bill.
    env_vars:
      - OPENROUTER_API_KEY
      - OPENROUTER_MODEL_ALLOWLIST
    notes: Chat completions via backend/utils/model_router.py (provider pinned to Anthropic; usage.cost requested), Jev decisions via backend/utils/stop_check.py, key limit via https://openrouter.ai/api/v1/key in scripts/conversation_lab.py.

  - name: Nano Banana (Gemini image generation)
    purpose: Image generation comparison vs Stability AI.
    env_vars:
      - NANOBANANA_API_KEY
      - NANOBANANA_MODEL
      - NANOBANANA_COST_PER_IMAGE
      - GOOGLE_API_KEY
    notes: Implemented via google-genai image models (e.g., gemini-2.5-flash-image).

  - name: Bing Webmaster Tools API
    purpose: SEO baseline (crawl stats, query stats, index status) for the apex property https://muffinpanrecipes.com.
    env_vars:
      - BING_WEBMASTER_API_KEY
    notes: Local-only script scripts/bing_webmaster_baseline.py (JSON endpoints at ssl.bing.com/webmaster/api.svc/json); run via doppler run. Output in seo-audits/weekly/<date>/bing_webmaster.json. Not used by the Lambda.

  - name: IndexNow
    purpose: Notify participating search engines (Bing and others) of new/changed URLs on each Sunday publish.
    env_vars: []
    notes: backend/utils/indexnow.py POSTs to https://api.indexnow.org/indexnow. The key is public by design (served at /015dad665f3a6ddeeab4565e96d0dd50.txt from src/), so it is committed rather than kept in Doppler.

  - name: Stability AI
    purpose: Production image generation (SDXL).
    env_vars:
      - STABILITY_API_KEY
      - STABILITY_ENGINE_ID
      - STABILITY_COST_PER_IMAGE
    notes: Used by backend/agents/art_director.py and scripts/direct_harvest.py.

  - name: Vercel
    purpose: Hosting and Vercel Blob storage for episodes, pages, and images.
    env_vars:
      - BLOB_READ_WRITE_TOKEN
      - VERCEL_ENV
    notes: Storage uses backend/storage.py and Vercel Blob REST API; the Vercel build reads authoritative episode and catalog sources from Blob. Sunday source publication does not trigger an automatic deploy.

  - name: Discord Webhooks
    purpose: Notifications for review and pipeline status.
    env_vars:
      - DISCORD_WEBHOOK_URL
      - DISCORD_FAILURE_WEBHOOK_URL
      - DISCORD_JUDGE_WEBHOOK_URL
    notes: Used by backend/utils/discord.py.

  - name: Doppler
    purpose: Secrets management for all environments.
    env_vars:
      - DOPPLER_TOKEN
    notes: Run commands via "doppler run -- <command>".

  - name: Cloudflare R2
    purpose: Image generation job handoff to RunPod.
    env_vars:
      - MUFFINPANRECIPES_R2_ACCESS_KEY_ID
      - MUFFINPANRECIPES_R2_SECRET_ACCESS_KEY
      - MUFFINPANRECIPES_R2_ENDPOINT
      - MUFFINPANRECIPES_R2_BUCKET_NAME
    notes: Used by scripts/trigger_generation.py.
